
name: Build APK
on: [push]
jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout code
uses: actions/checkout@v3
- name: Set up JDK 17
uses: actions/setup-java@v3
with:
distribution: 'temurin'
java-version: '17'
- name: Unzip Project
run: unzip reels.zip -d project
- name: Build APK
run: |
cd project
chmod +x gradlew
./assembleDebug
- name: Upload APK
uses: actions/upload-artifact@v3
with:
name: app-debug
path: project/app/build/outputs/apk/debug/app-debug.apk
Paste karne ke baad niche 'Commit changes' par tap kar dena.
